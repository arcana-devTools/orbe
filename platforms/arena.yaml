# Arena.ai — a IA do próprio Arena (modo Agent)
#
# COMO USAR: no seu PC (HEADLESS=0), crie a conta desta plataforma e clique em
# LOGIN uma vez — a sessão fica salva no perfil. A partir daí o Orbe abre a
# Arena e manda o prompt.
#
# RECALIBRADO AO VIVO em 24/09/2026 (conta real, autorizada):
#   - O app logado vive em https://arena.ai/agent — composer direto na tela,
#     modo "Agent" já selecionado (botão com esse nome ao lado do composer).
#     NÃO precisa clicar New Chat nem escolher modo antes de digitar.
#   - A rota /login MORREU (404); a home pública virou landing de marketing
#     ("Experience the frontier"), sem menu de modos — o probe antigo (clicar
#     "Auto" e achar "Agent") deu logged_out FALSO com sessão viva.
#   - Detector novo = API do próprio site: GET /api/me com cookies → 200 com
#     corpo contendo "supabaseUserId" = logado; 403 = deslogado. Imune a drift.
id: arena
name: Arena.ai
kind: browser
category: chat
url: "https://arena.ai/agent"
new_chat_url: "https://arena.ai/agent"
# login DA MÃO: landing com "Get started" → modal "Log In or Create Account"
login_url: "https://arena.ai/"

# O composer já está pronto em /agent (modo Agent default). Nada a fazer antes.
pre_actions: []

# ATENÇÃO (24/09/2026): a única <textarea> da página é a INVISÍVEL do
# reCAPTCHA (g-recaptcha-response) — prompt nela some no buraco. O composer
# real é o contenteditable (tiptap/ProseMirror) ao lado do botão "Send message".
prompt_selector: 'div[contenteditable="true"].tiptap, div[contenteditable="true"].ProseMirror, div[contenteditable="true"], textarea:not([name="g-recaptcha-response"])'
submit:
  selector: 'button:has-text("Send message")'
  key: Enter
answer_selector: '[data-message-author-role="assistant"], article, .markdown, [class*="message"]'
answer_index: -1
settle_ms: 3500
max_wait_s: 240          # agent mode pensa longo
logged_in_selector: 'textarea'
logged_out_selector: 'a[href*="login"], a[href*="signin"], button:has-text("Sign in"), button:has-text("Log in")'
# Detector PRIMÁRIO: API com os cookies do perfil (200 + usuário = logado).
# O DOM fica só como fallback caso o endpoint mude.
check_api:
  endpoint: "/api/me"
  # convidado TAMBÉM volta 200 com supabaseUserId, mas com email vazio —
  # o marcador de login REAL é email não-vazio
  expect_regex: '"email":"[^"]'  
extra:
  dica: "Se quiser outro modo/modelo, clique no seletor ao lado do composer antes de enviar."
