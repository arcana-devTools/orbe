id: github
name: GitHub
kind: browser
category: codigo
url: "https://github.com/search?q=orbe&type=repositories"
new_chat_url: "https://github.com/search?q=orbe&type=repositories"
prompt_selector: 'input[name="q"], input[type="search"]'
submit:
  key: Enter
answer_selector: '[data-testid="results-list"], .search-results, main'
