id: notion
name: Notion
kind: browser
category: produtividade
url: "https://www.notion.so/"
new_chat_url: "https://www.notion.so/"
prompt_selector: 'div[contenteditable="true"], textarea'
submit:
  key: Enter
answer_selector: '.notion-page-content, .notion-scroller, main'
answer_index: -1
settle_ms: 3000
max_wait_s: 60
logged_in_selector: '[data-testid="notion-search"], a[href*="notion.so"]'
logged_out_selector: 'a[href*="login"], button:has-text("Log in")'
extra:
  dica: "Para escrever/anotar de verdade, o caminho robusto é a API do Notion (kind: api) — veja ROADMAP.md."
