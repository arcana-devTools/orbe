services:
  orbe:
    build: .
    restart: unless-stopped
    env_file: .env              # defina ORBE_AUTH_TOKEN=algo-forte aqui!
    volumes:
      - ./data:/app/data        # <-- sua "nuvem": perfis, cofre, histórico
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data

volumes:
  caddy_data:
